<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Search ITEM DATA</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Arial', sans-serif;
    }
    .fixed-top-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      background: white;
      z-index: 1000;
      padding: 20px;
      border-radius: 10px 10px 0 0;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
    .form-control, .form-select {
      border-radius: 5px;
    }
    .dropdown-menu {
      max-height: 250px;
      overflow-y: auto;
    }
    .table th {
      background-color: #007bff;
      color: white;
    }
    .scrollable-container {
      margin-top: 330px;
      max-height: calc(100vh - 220px);
      overflow-y: auto;
      padding: 20px;
    }
  </style>

  <script>
    function toggleAllUnits(source, prefix) {
      const checkboxes = document.querySelectorAll(`.${prefix}unit-checkbox`);
      checkboxes.forEach(checkbox => {
        checkbox.checked = source.checked;
      });
      updateDropdownText(prefix);
    }

    function updateDropdownText(prefix) {
      const selected = Array.from(document.querySelectorAll(`.${prefix}unit-checkbox:checked`))
        .map(cb => cb.value)
        .join(", ");
      document.getElementById(`${prefix}unitDropdown`).innerText = selected || "Select Unit(s)";
    }
  </script>
</head>
<body>
  <div class="fixed-top-container">
    <h2 class="mb-4 text-center text-primary">Search ITEM DATA</h2>

    <ul class="nav nav-tabs mb-3" id="itemTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="gc-tab" data-bs-toggle="tab" data-bs-target="#gc" type="button" role="tab">GC</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="pharma-tab" data-bs-toggle="tab" data-bs-target="#pharma" type="button" role="tab">Pharma</button>
      </li>
    </ul>

    <div class="tab-content" id="itemTabsContent">

      <!-- GC Tab -->
      <div class="tab-pane fade show active" id="gc" role="tabpanel">
        <form method="POST" action="/search" target="_blank">
          <div class="mb-3">
            <label for="item_codes" class="form-label">Enter Item Codes:</label>
            <input type="text" class="form-control" name="item_codes" placeholder="e.g., 0000000000"/>
          </div>

          <div class="mb-3">
            <label class="form-label">Enter Manufacturer (MFG):</label>
            <input type="text" class="form-control" name="mfg" placeholder="e.g., Manipal Health Care"/>
          </div>

          <div class="mb-3">
            <label class="form-label">Enter Vendor Code:</label>
            <input type="text" class="form-control" name="vendor_code" placeholder="e.g., 00000000"/>
          </div>

          <div class="mb-3">
            <label class="form-label">Enter Description:</label>
            <input type="text" class="form-control" name="description" placeholder="e.g., Paracetamol Tablet"/>
          </div>

          <div class="mb-3">
            <label class="form-label">Select Unit Name(s):</label>
            <div class="dropdown">
              <button class="btn btn-secondary dropdown-toggle w-100" type="button" id="gc_unitDropdown" data-bs-toggle="dropdown">
                Select Unit(s)
              </button>
              <ul class="dropdown-menu p-2" style="width: 100%;">
                <li><input type="checkbox" id="gc_selectAll" onclick="toggleAllUnits(this, 'gc_')"> <label for="gc_selectAll">All</label></li>
                <!-- Reuse these unit names in both tabs -->
                <script>
                  const units = [
                    "MHB1","MMB1","MWP1","MNB1","KMC1","MDP1","MGA1","MJP1","MSA1","MVJ1","MHSR","MHVR","MHPK","MHPB",
                    "MHYP","MHHB","MHDB","MHMY","MHGG","MHP1","MHGH","MHSL","MDHK","MSLA","MPPP","MHNB","MHSB","MHMR",
                    "MHRA","MHRN","MHSG","MHRP","MHEC"
                  ];
                  window.onload = () => {
                    const gcList = document.querySelector('#gc .dropdown-menu');
                    const pharmaList = document.querySelector('#pharma .dropdown-menu');
                    units.forEach(unit => {
                      gcList.innerHTML += `<li><input type="checkbox" name="unit_name[]" value="${unit}" class="gc_unit-checkbox" onclick="updateDropdownText('gc_')"> ${unit}</li>`;
                      pharmaList.innerHTML += `<li><input type="checkbox" name="unit_name[]" value="${unit}" class="pharma_unit-checkbox" onclick="updateDropdownText('pharma_')"> ${unit}</li>`;
                    });
                  };
                </script>
              </ul>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100">Search</button>
        </form>
      </div>

      <!-- Pharma Tab -->
      <div class="tab-pane fade" id="pharma" role="tabpanel">
        <form method="POST" action="{{ url_for('pharma.search_pharma_item') }}" target="_blank">
          <div class="mb-3">
            <label class="form-label">Enter Item Codes:</label>
            <input type="text" class="form-control" name="item_codes" placeholder="e.g., 0000000000"/>
          </div>

          <div class="mb-3">
            <label class="form-label">Enter Manufacturer (MFG):</label>
            <input type="text" class="form-control" name="mfg" placeholder="e.g., Manipal Health Care"/>
          </div>

          <div class="mb-3">
            <label class="form-label">Enter Formulation:</label>
            <input type="text" class="form-control" name="formulation" placeholder="e.g., Tablet"/>
          </div>

          <div class="mb-3">
            <label class="form-label">Enter Description:</label>
            <input type="text" class="form-control" name="description" placeholder="e.g., Paracetamol Tablet"/>
          </div>

          <div class="mb-3">
            <label class="form-label">Select Unit Name(s):</label>
            <div class="dropdown">
              <button class="btn btn-secondary dropdown-toggle w-100" type="button" id="pharma_unitDropdown" data-bs-toggle="dropdown">
                Select Unit(s)
              </button>
              <ul class="dropdown-menu p-2" style="width: 100%;">
                <li><input type="checkbox" id="pharma_selectAll" onclick="toggleAllUnits(this, 'pharma_')"> <label for="pharma_selectAll">All</label></li>
                <!-- Units will be injected here by JS -->
              </ul>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100">Search</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
