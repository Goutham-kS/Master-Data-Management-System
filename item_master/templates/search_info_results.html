<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Search Results</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Arial', sans-serif;
    }

    .table-container {
      max-height: 70vh;
      overflow-y: auto;
      overflow-x: auto;
    }

    .table {
      min-width: max-content;
      table-layout: auto;
      border-collapse: collapse;
    }

    .table th,
    .table td {
      min-width: 100px;
      padding: 10px;
      text-align: center;
      border: 1px solid #ddd;
    }

    .table th {
      background-color: #007bff;
      color: white;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .table th:first-child,
    .table td:first-child {
      position: sticky;
      left: 0;
      z-index: 1;
    }

    .table thead th:first-child {
      z-index: 3;
    }

    .resizer {
      position: absolute;
      right: 0;
      top: 0;
      width: 5px;
      height: 100%;
      cursor: col-resize;
      background: transparent;
    }

    .resizer:hover {
      background: #666;
    }

    td[contenteditable="true"] {
      cursor: text;
      outline: none;
    }

    td.edited {
      background-color: #fff3cd;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="results-card">
      <h3 class="mb-4 text-center">📋 Search Results</h3>

      {% if results %}
      <form method="POST" action="{{ url_for('app_routes.export_results') }}">
        <input type="hidden" name="column_order" value="{{ results[0].keys() | join(',') }}">
        <div class="d-flex justify-content-end mb-3">
          <button type="submit" class="btn btn-success">
            ⬇️ Download Excel
          </button>
        </div>
      </form>

      <div class="table-container">
        <table class="table align-middle">
          <thead>
            <tr>
              {% for key in results[0].keys() %}
              <th>
                {{ key }}
                <div class="resizer"></div>
              </th>
              {% endfor %}
            </tr>
          </thead>
          <tbody>
            {% for row in results %}
            <tr>
              {% for value in row.values() %}
              <td>{{ value }}</td>
              {% endfor %}
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
      {% else %}
      <div class="alert alert-warning text-center">⚠️ No data found.</div>
      {% endif %}

      <div class="text-center mt-4">
        <a href="{{ url_for('app_routes.search_info') }}" class="btn btn-outline-secondary">
          🔙 Back to Search
        </a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Column resizer logic
      document.querySelectorAll(".resizer").forEach(resizer => {
        let startX, startWidth, column;

        resizer.addEventListener("mousedown", function (event) {
          column = event.target.parentElement;
          startX = event.clientX;
          startWidth = column.offsetWidth;

          document.addEventListener("mousemove", resizeColumn);
          document.addEventListener("mouseup", stopResize);
        });

        function resizeColumn(event) {
          const newWidth = startWidth + (event.clientX - startX);
          column.style.width = `${newWidth}px`;
        }

        function stopResize() {
          document.removeEventListener("mousemove", resizeColumn);
          document.removeEventListener("mouseup", stopResize);
        }
      });

      // Highlight and auto-resize edited cells
      document.querySelectorAll("td[contenteditable=true]").forEach(cell => {
        cell.addEventListener("input", function () {
          this.classList.add("edited");
          this.style.height = "auto";
          this.style.height = this.scrollHeight + "px";
        });
      });
    });
  </script>
</body>
</html>
